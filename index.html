<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Calculadora"><title>Calculadora</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head><body>
<main class="calculator" aria-label="Calculadora"><header><span class="toolbar-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><path d="M16 6v11H9"/></svg></span><span class="toolbar-icon" aria-hidden="true"><svg viewBox="0 0 32 32" class="calculator-icon"><rect x="7" y="2" width="18" height="28" rx="3" fill="currentColor" stroke="none"/><rect x="9.5" y="5" width="13" height="6" rx="1.4" fill="#222" stroke="none"/><g fill="#222" stroke="none"><circle cx="11" cy="15" r="1.9"/><circle cx="16" cy="15" r="1.9"/><circle cx="21" cy="15" r="1.9"/><circle cx="11" cy="20" r="1.9"/><circle cx="16" cy="20" r="1.9"/><circle cx="21" cy="20" r="1.9"/><circle cx="11" cy="25" r="1.9"/><circle cx="16" cy="25" r="1.9"/><circle cx="21" cy="25" r="1.9"/></g></svg></span></header>
<section class="display" aria-label="Pantalla"><div id="expression" class="expression"></div><div id="number-window" class="number-window"><output id="number" aria-live="polite">0</output></div></section>
<section class="keypad" aria-label="Teclado">
<button class="utility" data-key="back" aria-label="Borrar último dígito"><svg viewBox="0 0 48 48"><path d="M21 7h18a3 3 0 0 1 3 3v28a3 3 0 0 1-3 3H21a5 5 0 0 1-3.5-1.5L3 25a2 2 0 0 1 0-3L17.5 8.5A5 5 0 0 1 21 7Z"/><path d="m19 17 14 14m0-14L19 31"/></svg></button>
<button class="utility clear" data-key="clear">AC</button><button class="utility percent" data-key="%">%</button><button class="operator" data-key="/" aria-label="Dividir"><svg viewBox="0 0 48 48"><path d="M8 24h32"/><circle cx="24" cy="11" r="3.2" fill="currentColor" stroke="none"/><circle cx="24" cy="37" r="3.2" fill="currentColor" stroke="none"/></svg></button>
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="operator" data-key="*" aria-label="Multiplicar"><svg viewBox="0 0 48 48"><path d="m11 11 26 26m0-26L11 37"/></svg></button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="operator" data-key="-" aria-label="Restar"><svg viewBox="0 0 48 48"><path d="M8 24h32"/></svg></button>
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="operator" data-key="+" aria-label="Sumar"><svg viewBox="0 0 48 48"><path d="M8 24h32M24 8v32"/></svg></button>
<button data-key="sign" aria-label="Cambiar signo"><svg viewBox="0 0 48 48"><path d="m37 5-26 38M5 14h12M11 8v12m20 15h12" stroke-width="3"/></svg></button><button data-key="0">0</button><button data-key="." aria-label="Coma decimal">,</button><button class="operator" data-key="=" aria-label="Igual"><svg viewBox="0 0 48 48"><path d="M11 17h26M11 31h26"/></svg></button>
</section></main><script src="./engine.js"></script><script src="./app.js"></script></body></html>
